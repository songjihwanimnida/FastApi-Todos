services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app2
    ports:
      - "5005:8000"
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
    networks:
      - loadtest-net

  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter
    volumes:
      - ./jmeter:/jmeter
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /jmeter/results.jtl
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -JTHREADS=${JMETER_THREADS:-10}         # 부하량은 실행할 때 환경변수로 조절 (기본값은 기존과 같음)
      - -JLOOPS=${JMETER_LOOPS:-1}
      - -JRAMP=${JMETER_RAMP:-10}
      - -f                                      # 다시 실행할 때 이전 results.jtl·report 를 지움 (report 폴더가 남아 있으면 -o 가 실패함)
      - -Jjmeter.save.saveservice.output_format=csv
      - -e
      - -o
      - /jmeter/report
    networks:
      - loadtest-net

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # ← 추가: 볼륨을 컨테이너 경로에 마운트
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # ← 추가: /tmp를 쓰기 가능하게
      - /tmp
    networks:
      - loadtest-net

# services: 아래에 추가 (앞의 들여쓰기 2칸까지 그대로)
  prometheus:
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)
    networks:
      - loadtest-net
    # services: 아래에 추가 (앞의 들여쓰기 2칸까지 그대로)
  grafana:
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (2026-10-13 보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro   # InfluxDB 데이터 소스 자동 등록 (UI로 만든 Prometheus 는 볼륨에 그대로)
    networks:
      - loadtest-net
  influxdb:
    image: influxdb:1.13.2                      # latest 대신 버전 고정 (1.x: 토큰 없이 JMeter Backend Listener 가 바로 씀)
    container_name: influxdb
    read_only: true                             # 쓰기는 데이터 볼륨과 /tmp 만
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                                     # 이미지가 처음부터 influxdb 사용자로 실행되므로 추가 권한 불필요
    environment:
      - INFLUXDB_DB=jmeter                      # 처음 시작할 때 jmeter DB 자동 생성
    volumes:
      - influxdb-data:/var/lib/influxdb         # 테스트 결과 저장 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped
    # ports 없음: 1.x 는 기본 인증이 꺼져 있음. JMeter·Grafana 는 내부 네트워크(influxdb:8086)로 접근
    networks:
      - loadtest-net
  # services: 아래에 추가 (앞의 들여쓰기 2칸까지 그대로)
  node-exporter:
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집하므로 외부 공개 불필요
    networks:
      - loadtest-net
  # services: 아래에 추가 (앞의 들여쓰기 2칸까지 그대로)
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6      # latest 대신 버전 고정 (v0.53.0부터 ghcr.io로 이전)
    container_name: cadvisor
    privileged: true                            # 호스트의 cgroup·컨테이너 정보를 읽기 위해 필요
    devices:
      - /dev/kmsg                               # OOM 등 커널 이벤트 수집용
    volumes:                                    # 호스트 정보는 모두 읽기 전용(:ro)으로 마운트
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    # ports 없음: Prometheus가 내부 네트워크(cadvisor:8080)로 수집 + Jenkins 8080과 충돌 방지 + 웹 UI에 로그인 기능 없음
    networks:
      - loadtest-net

volumes:                                        # ← 최상위(0칸)로 이동
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  prometheus-data:
  grafana-data:
  influxdb-data:

networks:                                       # 최상위(0칸): 위 서비스들이 쓰는 네트워크 정의
  loadtest-net:
    driver: bridge                              # 기본 브리지 네트워크 (같은 compose 안의 서비스끼리 이름으로 통신)