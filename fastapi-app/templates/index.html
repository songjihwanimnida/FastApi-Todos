<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  :root {
    --accent: #dc4c3e;
    --accent-hover: #c3402f;
    --bg: #ffffff;
    --sidebar-bg: #fcfaf8;
    --border: #eeeeee;
    --text: #202020;
    --text-muted: #808080;
    --row-hover: #f8f8f7;
    --danger: #d1453b;
    --sidebar-w: 288px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #4b7fd6; outline-offset: 1px; border-radius: 3px; }

  /* ---------- 레이아웃 ---------- */
  .app { display: flex; min-height: 100vh; }

  .topbar {
    position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 30;
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: var(--accent); color: #fff;
  }
  .topbar button { color: #fff; padding: 8px; border-radius: 4px; display: flex; }
  .topbar button:hover { background: rgba(255, 255, 255, .18); }
  .topbar-title { font-weight: 600; font-size: 15px; }

  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    padding: 52px 12px 24px; position: fixed; inset: 0 auto 0 0; z-index: 20;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 14px; font-weight: 700; font-size: 16px; }
  .brand-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); flex: none; }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 8px; border-radius: 5px; text-align: left; color: var(--text);
  }
  .nav-item:hover { background: #ececec; }
  .nav-item[aria-current="page"] { background: #ffefe5; color: var(--accent); font-weight: 600; }
  .nav-item svg { flex: none; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count { color: var(--text-muted); font-size: 12px; font-weight: 400; }
  .nav-item[aria-current="page"] .nav-count { color: var(--accent); }

  .scrim { display: none; }

  .main { flex: 1; min-width: 0; margin-left: var(--sidebar-w); padding: 52px 24px 96px; }
  .content { max-width: 720px; margin: 0 auto; }
  .page-title { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 18px; }
  .page-title h1 { font-size: 20px; margin: 0; }
  .page-title .count { color: var(--text-muted); font-size: 13px; }

  /* ---------- 할 일 목록 ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex; gap: 10px; padding: 9px 4px 9px 0;
    border-bottom: 1px solid var(--border); align-items: flex-start;
  }
  .task:hover { background: var(--row-hover); }
  .check {
    flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
    border: 1.5px solid #bcbcbc; display: flex; align-items: center; justify-content: center;
    color: transparent; transition: background .12s, border-color .12s;
  }
  .check:hover { border-color: var(--accent); color: #c9c9c9; }
  .check[aria-checked="true"] { background: #b8b8b8; border-color: #b8b8b8; color: #fff; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { overflow-wrap: anywhere; }
  .task-desc { color: var(--text-muted); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .task[data-done="true"] .task-title { color: var(--text-muted); text-decoration: line-through; }
  .task-actions { display: flex; gap: 2px; opacity: 0; flex: none; }
  .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
  .icon-btn { padding: 5px; border-radius: 4px; color: var(--text-muted); display: flex; }
  .icon-btn:hover { background: #ececec; color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }

  /* ---------- 입력 폼 ---------- */
  .adder { padding: 8px 0 4px; }
  .add-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 0; color: var(--text-muted); }
  .add-trigger:hover { color: var(--accent); }
  .add-trigger .plus {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .add-trigger:hover .plus { background: var(--accent); color: #fff; }

  .card { border: 1px solid #dedede; border-radius: 8px; padding: 10px 12px; background: #fff; }
  .card input[type="text"], .card textarea {
    display: block; width: 100%; border: 0; padding: 2px 0; background: none; resize: none;
  }
  .card input[type="text"] { font-weight: 500; }
  .card textarea { font-size: 12px; color: #555; min-height: 20px; }
  .card input::placeholder, .card textarea::placeholder { color: #a5a5a5; }
  .card input:focus, .card textarea:focus { outline: none; }
  .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .btn { padding: 7px 13px; border-radius: 5px; font-size: 13px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary[disabled] { opacity: .5; cursor: default; }
  .btn-ghost { background: #f5f5f5; color: #333; }
  .btn-ghost:hover { background: #ebebeb; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b8382f; }

  /* ---------- 상태 표시 ---------- */
  .state { text-align: center; color: var(--text-muted); padding: 48px 16px; }
  .state h2 { font-size: 15px; color: var(--text); margin: 0 0 6px; }
  .state p { margin: 0; font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 16px; border-radius: 6px;
    font-size: 13px; z-index: 60; max-width: calc(100vw - 32px);
  }
  .toast[hidden] { display: none; }

  /* ---------- 삭제 확인 ---------- */
  dialog {
    border: 0; border-radius: 10px; padding: 20px; max-width: 380px; width: calc(100vw - 32px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .2); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h2 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 0 0 4px; font-size: 13px; color: #555; overflow-wrap: anywhere; }
  dialog .warn { color: var(--danger); }
  dialog .card-actions { margin-top: 18px; }

  @media (max-width: 767px) {
    .sidebar { transform: translateX(-100%); transition: transform .18s ease; box-shadow: 0 0 24px rgba(0, 0, 0, .12); }
    body[data-menu="open"] .sidebar { transform: none; }
    body[data-menu="open"] .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 15; }
    .main { margin-left: 0; padding: 52px 16px 96px; }
  }
  @media (min-width: 768px) {
    .topbar-menu { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="topbar-menu" id="menu-btn" aria-label="메뉴 열기" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <span class="topbar-title">Todo</span>
</header>

<div class="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>내 할 일</div>
    <nav class="nav" id="nav" aria-label="목록 선택"></nav>
  </aside>

  <main class="main">
    <div class="content">
      <div class="page-title">
        <h1 id="view-title">인박스</h1>
        <span class="count" id="view-count"></span>
      </div>
      <div id="list-area" aria-live="polite"></div>
      <div class="adder" id="adder"></div>
    </div>
  </main>
</div>

<p class="toast" id="toast" role="status" hidden></p>

<dialog id="confirm-dialog">
  <h2>할 일을 삭제할까요?</h2>
  <p id="confirm-target"></p>
  <p class="warn">삭제한 할 일은 복구할 수 없습니다.</p>
  <div class="card-actions">
    <button class="btn btn-ghost" id="confirm-cancel" autofocus>취소</button>
    <button class="btn btn-danger" id="confirm-ok">삭제</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);

// 사용자 입력은 항상 textContent 로만 넣는다 (HTML 로 해석하지 않는다)
function make(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(Boolean));
  return node;
}

function icon(path, size = 18) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = path;
  return svg;
}

const ICONS = {
  inbox: '<path d="M4 4h16v10h-5a3 3 0 0 1-6 0H4z"/><path d="M4 14v6h16v-6"/>',
  all: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  done: '<path d="M20 6 9 17l-5-5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};

const VIEWS = {
  inbox: {
    title: "인박스", icon: ICONS.inbox, filter: (t) => !t.completed,
    empty: { h: "할 일을 모두 마쳤습니다", p: "아래에서 새 할 일을 추가해 보세요." },
  },
  all: {
    title: "전체", icon: ICONS.all, filter: () => true,
    empty: { h: "할 일이 없습니다", p: "추가한 할 일이 여기에 모두 표시됩니다." },
  },
  done: {
    title: "완료", icon: ICONS.done, filter: (t) => t.completed,
    empty: { h: "완료한 할 일이 없습니다", p: "체크한 할 일이 이곳에 쌓입니다." },
  },
};

const state = { todos: [], view: "inbox", editingId: null, adding: false, loading: true, failed: false, busy: false };

/* ---------- 서버 통신 ---------- */
async function api(url, method = "GET", body) {
  const res = await fetch(url, body
    ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { method });
  if (!res.ok) throw new Error(String(res.status));
  return res.status === 204 ? null : res.json();
}

let toastTimer;
function toast(message) {
  $("toast").textContent = message;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3500);
}

// 진행 중인 변경이 있으면 중복 요청을 보내지 않는다
async function run(what, job) {
  if (state.busy) return false;
  state.busy = true;
  try {
    await job();
    return true;
  } catch (e) {
    toast(`${what}에 실패했습니다. (${e.message})`);
    return false;
  } finally {
    state.busy = false;
  }
}

async function load() {
  try {
    state.todos = await api("/todos");
    state.failed = false;
  } catch {
    state.failed = true;
  } finally {
    state.loading = false;
    render();
  }
}

/* ---------- 렌더링 ---------- */
function render() { renderNav(); renderList(); renderAdder(); }

function renderNav() {
  const nav = $("nav");
  nav.replaceChildren(...Object.entries(VIEWS).map(([key, view]) => {
    const btn = make("button", { className: "nav-item", type: "button" },
      icon(view.icon),
      make("span", { className: "nav-label", textContent: view.title }),
      make("span", { className: "nav-count", textContent: String(state.todos.filter(view.filter).length) }),
    );
    if (key === state.view) btn.setAttribute("aria-current", "page");
    btn.onclick = () => {
      state.view = key;
      state.editingId = null;
      state.adding = false;
      closeMenu();
      render();
    };
    return btn;
  }));

  const view = VIEWS[state.view];
  $("view-title").textContent = view.title;
  $("view-count").textContent = state.loading || state.failed ? "" : `${state.todos.filter(view.filter).length}개`;
  document.title = `${view.title} · Todo`;
}

function renderList() {
  const area = $("list-area");
  const view = VIEWS[state.view];

  if (state.loading) {
    area.replaceChildren(stateBlock("불러오는 중…"));
    return;
  }
  if (state.failed) {
    const retry = make("button", { className: "btn btn-primary", type: "button", textContent: "다시 불러오기" });
    retry.onclick = () => { state.loading = true; render(); load(); };
    area.replaceChildren(stateBlock("목록을 불러오지 못했습니다", "서버가 실행 중인지 확인해 주세요.", retry));
    return;
  }

  const items = state.todos.filter(view.filter);
  if (!items.length) {
    area.replaceChildren(stateBlock(view.empty.h, view.empty.p));
    return;
  }
  area.replaceChildren(make("ul", { className: "list" }, ...items.map(taskRow)));
}

function stateBlock(heading, text, extra) {
  return make("div", { className: "state" },
    make("h2", { textContent: heading }),
    text ? make("p", { textContent: text }) : null,
    extra ? make("div", { style: "margin-top:14px" }, extra) : null,
  );
}

function taskRow(todo) {
  if (state.editingId === todo.id) {
    return make("li", { className: "task", style: "border:0;padding:4px 0" }, editorCard({
      title: todo.title,
      description: todo.description,
      submitLabel: "저장",
      onCancel: () => { state.editingId = null; render(); },
      onSubmit: async (values) => {
        const ok = await run("수정", () => api(`/todos/${todo.id}`, "PUT", { ...todo, ...values, completed: todo.completed }));
        if (ok) { state.editingId = null; await load(); }
        return ok;
      },
    }));
  }

  const check = make("button", { className: "check", type: "button", role: "checkbox" }, icon(ICONS.check, 14));
  check.setAttribute("aria-checked", String(todo.completed));
  check.setAttribute("aria-label", todo.completed ? `${todo.title} 완료 취소` : `${todo.title} 완료`);
  check.onclick = async () => {
    check.disabled = true;
    const ok = await run(todo.completed ? "완료 취소" : "완료 처리",
      () => api(`/todos/${todo.id}`, "PUT", { ...todo, completed: !todo.completed }));
    if (ok) await load();
    else check.disabled = false;
  };

  const edit = make("button", { className: "icon-btn", type: "button", title: "편집" }, icon(ICONS.edit, 16));
  edit.setAttribute("aria-label", `${todo.title} 편집`);
  edit.onclick = () => { state.editingId = todo.id; state.adding = false; render(); };

  const del = make("button", { className: "icon-btn danger", type: "button", title: "삭제" }, icon(ICONS.trash, 16));
  del.setAttribute("aria-label", `${todo.title} 삭제`);
  del.onclick = () => askDelete(todo, del);

  const row = make("li", { className: "task" },
    check,
    make("div", { className: "task-body" },
      make("div", { className: "task-title", textContent: todo.title }),
      todo.description ? make("div", { className: "task-desc", textContent: todo.description }) : null,
    ),
    make("div", { className: "task-actions" }, edit, del),
  );
  row.dataset.done = String(todo.completed);
  return row;
}

/* ---------- 추가 / 편집 폼 ---------- */
function renderAdder() {
  const box = $("adder");
  if (state.loading || state.failed) {
    box.replaceChildren();
    return;
  }

  if (!state.adding) {
    const trigger = make("button", { className: "add-trigger", type: "button" },
      make("span", { className: "plus" }, icon(ICONS.plus, 14)),
      make("span", { textContent: "할 일 추가" }),
    );
    trigger.onclick = () => { state.adding = true; state.editingId = null; render(); };
    box.replaceChildren(trigger);
    return;
  }

  box.replaceChildren(editorCard({
    title: "",
    description: "",
    submitLabel: "할 일 추가",
    keepOpen: true,
    onCancel: () => { state.adding = false; render(); },
    onSubmit: async (values) => {
      const ok = await run("추가", () => api("/todos", "POST", values));
      if (ok) await load();
      return ok;
    },
  }));
}

function editorCard({ title, description, submitLabel, keepOpen = false, onSubmit, onCancel }) {
  const titleInput = make("input", { type: "text", value: title, placeholder: "할 일 이름", maxLength: 100 });
  titleInput.setAttribute("aria-label", "할 일 이름");
  const descInput = make("textarea", { value: description || "", placeholder: "설명", rows: 1 });
  descInput.setAttribute("aria-label", "설명");

  const submit = make("button", { className: "btn btn-primary", type: "submit", textContent: submitLabel, disabled: !title.trim() });
  const cancel = make("button", { className: "btn btn-ghost", type: "button", textContent: "취소" });
  cancel.onclick = onCancel;

  const autoGrow = () => {
    descInput.style.height = "auto";
    descInput.style.height = `${descInput.scrollHeight}px`;
  };
  descInput.oninput = autoGrow;
  titleInput.oninput = () => { submit.disabled = !titleInput.value.trim(); };

  const form = make("form", { className: "card" },
    titleInput,
    descInput,
    make("div", { className: "card-actions" }, cancel, submit),
  );

  // 한글 조합 중 Enter 는 제출로 처리하지 않는다
  titleInput.onkeydown = (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  };
  form.onkeydown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); onCancel(); }
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const value = titleInput.value.trim();
    if (!value) { titleInput.focus(); return; }

    submit.disabled = true;
    cancel.disabled = true;
    const ok = await onSubmit({ title: value, description: descInput.value.trim() });
    if (!ok) { submit.disabled = false; cancel.disabled = false; return; }
    if (keepOpen) {
      // 연속 등록: 입력만 비우고 폼은 열어 둔다
      titleInput.value = "";
      descInput.value = "";
      autoGrow();
      submit.disabled = true;
      cancel.disabled = false;
      titleInput.focus();
    }
  };

  queueMicrotask(() => { titleInput.focus(); autoGrow(); });
  return form;
}

/* ---------- 삭제 확인 ---------- */
const dialog = $("confirm-dialog");
let deleteTarget = null;
let deleteOpener = null;

function askDelete(todo, opener) {
  deleteTarget = todo;
  deleteOpener = opener;
  $("confirm-target").textContent = `"${todo.title}"`;
  dialog.showModal();
}

$("confirm-cancel").onclick = () => dialog.close();
$("confirm-ok").onclick = async () => {
  const todo = deleteTarget;
  dialog.close();
  if (!todo) return;
  const ok = await run("삭제", () => api(`/todos/${todo.id}`, "DELETE"));
  if (ok) {
    if (state.editingId === todo.id) state.editingId = null;
    await load();
  }
};
dialog.addEventListener("close", () => {
  if (deleteOpener && deleteOpener.isConnected) deleteOpener.focus();
  deleteTarget = null;
  deleteOpener = null;
});

/* ---------- 좁은 화면 메뉴 ---------- */
function closeMenu() {
  document.body.dataset.menu = "closed";
  $("menu-btn").setAttribute("aria-expanded", "false");
  $("menu-btn").setAttribute("aria-label", "메뉴 열기");
}

$("menu-btn").onclick = () => {
  const open = document.body.dataset.menu === "open";
  document.body.dataset.menu = open ? "closed" : "open";
  $("menu-btn").setAttribute("aria-expanded", String(!open));
  $("menu-btn").setAttribute("aria-label", open ? "메뉴 열기" : "메뉴 닫기");
};
$("scrim").onclick = closeMenu;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.body.dataset.menu === "open") closeMenu();
});

render();
load();
</script>
</body>
</html>
