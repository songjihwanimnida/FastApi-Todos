<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%23dc4c3e'/><path d='m7 12.5 3.2 3.2L17 9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --accent: #dc4c3e;
    --accent-hover: #c3402f;
    --bg: #ffffff;
    --border: #eeeeee;
    --text: #202020;
    --text-muted: #808080;
    --row-hover: #f8f8f7;
    --danger: #d1453b;
    --p1: #d1453b;
    --p2: #eb8909;
    --p3: #246fe0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #4b7fd6; outline-offset: 1px; border-radius: 3px; }

  /* ---------- 레이아웃 ---------- */
  .topbar {
    position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 30;
    display: flex; align-items: center; padding: 0 16px;
    background: var(--accent); color: #fff;
  }
  .topbar-title { font-weight: 600; font-size: 15px; }

  .main { padding: 52px 24px 96px; }
  .content { max-width: 720px; margin: 0 auto; }
  .page-title { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 18px; }
  .page-title h1 { font-size: 20px; margin: 0; }
  .page-title .count { color: var(--text-muted); font-size: 13px; }

  /* ---------- 할 일 목록 ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex; gap: 10px; padding: 9px 4px 9px 0;
    border-bottom: 1px solid var(--border); align-items: flex-start;
  }
  .task:hover { background: var(--row-hover); }
  .check {
    flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
    border: 1.5px solid #bcbcbc; display: flex; align-items: center; justify-content: center;
    color: transparent; transition: background .12s, border-color .12s;
  }
  .check:hover { border-color: var(--accent); color: #c9c9c9; }
  /* 우선순위 색 — 완료 상태(아래 규칙)가 이긴다 */
  .check[data-priority="1"] { border-color: var(--p1); background: rgba(209, 69, 59, .1); }
  .check[data-priority="2"] { border-color: var(--p2); background: rgba(235, 137, 9, .1); }
  .check[data-priority="3"] { border-color: var(--p3); background: rgba(36, 111, 224, .1); }
  .check[data-priority="1"][aria-checked="false"]:hover { color: var(--p1); }
  .check[data-priority="2"][aria-checked="false"]:hover { color: var(--p2); }
  .check[data-priority="3"][aria-checked="false"]:hover { color: var(--p3); }
  .check[aria-checked="true"] { background: #b8b8b8; border-color: #b8b8b8; color: #fff; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { overflow-wrap: anywhere; }
  .task-desc { color: var(--text-muted); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .task[data-done="true"] .task-title { color: var(--text-muted); text-decoration: line-through; }
  .prio-tag { display: inline-flex; align-items: center; gap: 3px; margin-top: 3px; font-size: 12px; color: var(--text-muted); }
  .prio-tag[data-priority="1"] { color: var(--p1); }
  .prio-tag[data-priority="2"] { color: var(--p2); }
  .prio-tag[data-priority="3"] { color: var(--p3); }
  .task[data-done="true"] .prio-tag { color: var(--text-muted); }
  .task-actions { display: flex; gap: 2px; opacity: 0; flex: none; }
  .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
  .icon-btn { padding: 5px; border-radius: 4px; color: var(--text-muted); display: flex; }
  .icon-btn:hover { background: #ececec; color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }

  /* ---------- 진행률 ---------- */
  .progress { display: flex; align-items: center; gap: 10px; margin: -8px 0 18px; }
  .progress[hidden] { display: none; }
  .progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .25s ease; }
  .progress-text { flex: none; color: var(--text-muted); font-size: 12px; }

  /* ---------- 완료됨 섹션 ---------- */
  .done-section { margin-top: 20px; }
  .done-section summary {
    display: flex; align-items: center; gap: 6px; padding: 6px 0;
    border-bottom: 1px solid var(--border); cursor: pointer; list-style: none;
    font-weight: 600; font-size: 13px;
  }
  .done-section summary::-webkit-details-marker { display: none; }
  .done-section summary svg { color: var(--text-muted); transition: transform .15s; transform: rotate(-90deg); }
  .done-section[open] summary svg { transform: none; }
  .done-count { margin-left: 2px; color: var(--text-muted); font-size: 12px; font-weight: 400; }

  /* ---------- 입력 폼 ---------- */
  .adder { padding: 8px 0 4px; }
  .add-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 0; color: var(--text-muted); }
  .add-trigger:hover { color: var(--accent); }
  .add-trigger .plus {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .add-trigger:hover .plus { background: var(--accent); color: #fff; }

  .card { border: 1px solid #dedede; border-radius: 8px; padding: 10px 12px; background: #fff; }
  .task > .card { flex: 1; min-width: 0; }         /* 편집 카드는 행 너비를 꽉 채운다 */
  .card input[type="text"], .card textarea {
    display: block; width: 100%; border: 0; padding: 2px 0; background: none; resize: none;
  }
  .card input[type="text"] { font-weight: 500; }
  .card textarea { font-size: 12px; color: #555; min-height: 20px; }
  .card input::placeholder, .card textarea::placeholder { color: #a5a5a5; }
  .card input:focus, .card textarea:focus { outline: none; }
  .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .card-footer .card-actions { margin: 0 0 0 auto; }
  .prio-group { display: flex; align-items: center; gap: 2px; }
  .prio-label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
  .prio-btn {
    display: flex; align-items: center; gap: 3px; padding: 4px 7px; border-radius: 5px;
    font-size: 12px; color: var(--text-muted); border: 1px solid transparent;
  }
  .prio-btn:hover { background: #f3f3f3; }
  .prio-btn[aria-pressed="true"] { background: #f3f3f3; border-color: #dedede; color: var(--text); font-weight: 600; }
  .prio-btn[data-priority="1"] svg { color: var(--p1); }
  .prio-btn[data-priority="2"] svg { color: var(--p2); }
  .prio-btn[data-priority="3"] svg { color: var(--p3); }
  .btn { padding: 7px 13px; border-radius: 5px; font-size: 13px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary[disabled] { opacity: .5; cursor: default; }
  .btn-ghost { background: #f5f5f5; color: #333; }
  .btn-ghost:hover { background: #ebebeb; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b8382f; }

  /* ---------- 상태 표시 ---------- */
  .state { text-align: center; color: var(--text-muted); padding: 48px 16px; }
  .state h2 { font-size: 15px; color: var(--text); margin: 0 0 6px; }
  .state p { margin: 0; font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 16px; border-radius: 6px;
    font-size: 13px; z-index: 60; max-width: calc(100vw - 32px);
  }
  .toast[hidden] { display: none; }

  /* ---------- 삭제 확인 ---------- */
  dialog {
    border: 0; border-radius: 10px; padding: 20px; max-width: 380px; width: calc(100vw - 32px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .2); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h2 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 0 0 4px; font-size: 13px; color: #555; overflow-wrap: anywhere; }
  dialog .warn { color: var(--danger); }
  dialog .card-actions { margin-top: 18px; }

  @media (max-width: 767px) {
    .main { padding: 52px 16px 96px; }
  }
  /* 터치 기기·좁은 화면에는 hover 가 없다 → 편집·삭제 버튼을 늘 보이고 누르기 쉽게 44×44px 로 */
  @media (hover: none), (max-width: 767px) {
    .task-actions { opacity: 1; }
    .icon-btn { padding: 14px; margin: -9px 0; }   /* 음수 margin 으로 행 높이는 그대로 */
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="topbar-title">Todo</span>
</header>

<main class="main">
  <div class="content">
    <div class="page-title">
      <h1>전체</h1>
      <span class="count" id="view-count"></span>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress-track" id="progress-bar" role="progressbar" aria-label="완료 진행률" aria-valuemin="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <div id="list-area" aria-live="polite"></div>
    <div class="adder" id="adder"></div>
    <div id="done-area"></div>
  </div>
</main>

<p class="toast" id="toast" role="status" hidden></p>

<dialog id="confirm-dialog">
  <h2>할 일을 삭제할까요?</h2>
  <p id="confirm-target"></p>
  <p class="warn">삭제한 할 일은 복구할 수 없습니다.</p>
  <div class="card-actions">
    <button class="btn btn-ghost" id="confirm-cancel" autofocus>취소</button>
    <button class="btn btn-danger" id="confirm-ok">삭제</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);

// 사용자 입력은 항상 textContent 로만 넣는다 (HTML 로 해석하지 않는다)
function make(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(Boolean));
  return node;
}

function icon(path, size = 18) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = path;
  return svg;
}

const ICONS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
};

const PRIORITIES = [1, 2, 3, 4];                  // 1 이 가장 높다
const PRIORITY_HINT = { 1: " (가장 높음)", 4: " (기본)" };
const byPriority = (a, b) => a.priority - b.priority || a.id - b.id;

// focus: 다시 그린 뒤 포커스를 돌려줄 버튼의 data-focus 값 ("check-3", "edit-3", "add")
const state = { todos: [], editingId: null, adding: false, loading: true, failed: false, busy: false, doneOpen: false, focus: null };

/* ---------- 서버 통신 ---------- */
async function api(url, method = "GET", body) {
  const res = await fetch(url, body
    ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { method });
  if (!res.ok) throw new Error(String(res.status));
  return res.status === 204 ? null : res.json();
}

let toastTimer;
function toast(message) {
  $("toast").textContent = message;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3500);
}

// 진행 중인 변경이 있으면 중복 요청을 보내지 않는다
async function run(what, job) {
  if (state.busy) return false;
  state.busy = true;
  try {
    await job();
    return true;
  } catch (e) {
    toast(`${what}에 실패했습니다. (${e.message})`);
    return false;
  } finally {
    state.busy = false;
  }
}

async function load() {
  try {
    state.todos = await api("/todos");
    state.failed = false;
  } catch {
    state.failed = true;
  } finally {
    state.loading = false;
    render();
  }
}

/* ---------- 렌더링 ---------- */
function render() {
  renderProgress(); renderList(); renderAdder();
  if (state.focus) queueMicrotask(restoreFocus);  // 편집 카드의 자동 포커스(microtask)보다 나중에 실행
}

// 목록을 새로 그리면 누른 버튼이 사라져 포커스가 body 로 빠진다 → 같은 자리로 돌려준다
function restoreFocus() {
  const target = document.querySelector(`[data-focus="${state.focus}"]`);
  state.focus = null;
  if (!target) return;
  const closed = target.closest("details:not([open])");   // 접힌 "완료됨" 안이면 섹션 제목으로
  (closed ? closed.querySelector("summary") : target).focus();
}

function renderProgress() {
  const total = state.todos.length;
  $("view-count").textContent = state.loading || state.failed ? "" : `${total}개`;
  $("progress").hidden = state.loading || state.failed || total === 0;
  if ($("progress").hidden) return;

  const done = state.todos.filter((t) => t.completed).length;
  const pct = Math.round((done / total) * 100);
  $("progress-fill").style.width = `${pct}%`;
  $("progress-text").textContent = `${done}/${total} 완료 (${pct}%)`;
  $("progress-bar").setAttribute("aria-valuemax", String(total));
  $("progress-bar").setAttribute("aria-valuenow", String(done));
  $("progress-bar").setAttribute("aria-valuetext", `${total}개 중 ${done}개 완료`);
}

function renderList() {
  const area = $("list-area");
  $("done-area").replaceChildren();

  if (state.loading) {
    area.replaceChildren(stateBlock("불러오는 중…"));
    return;
  }
  if (state.failed) {
    const retry = make("button", { className: "btn btn-primary", type: "button", textContent: "다시 불러오기" });
    retry.onclick = () => { state.loading = true; render(); load(); };
    area.replaceChildren(stateBlock("목록을 불러오지 못했습니다", "서버가 실행 중인지 확인해 주세요.", retry));
    return;
  }

  if (!state.todos.length) {
    area.replaceChildren(stateBlock("할 일이 없습니다", "아래에서 새 할 일을 추가해 보세요."));
    return;
  }

  // 완료한 항목은 "할 일 추가" 아래 접이식 섹션으로 뺀다
  const items = [...state.todos].sort(byPriority);
  const open = items.filter((t) => !t.completed);
  const done = items.filter((t) => t.completed);
  area.replaceChildren(open.length
    ? make("ul", { className: "list" }, ...open.map(taskRow))
    : stateBlock("할 일을 모두 마쳤습니다", "아래에서 새 할 일을 추가해 보세요."));
  if (done.length) $("done-area").replaceChildren(doneSection(done));
}

function doneSection(done) {
  const details = make("details", { className: "done-section", open: state.doneOpen },
    make("summary", {},
      icon(ICONS.chevron, 16),
      make("span", { textContent: "완료됨" }),
      make("span", { className: "done-count", textContent: String(done.length) }),
    ),
    make("ul", { className: "list" }, ...done.map(taskRow)),
  );
  details.ontoggle = () => { state.doneOpen = details.open; };
  return details;
}

function stateBlock(heading, text, extra) {
  return make("div", { className: "state" },
    make("h2", { textContent: heading }),
    text ? make("p", { textContent: text }) : null,
    extra ? make("div", { style: "margin-top:14px" }, extra) : null,
  );
}

function taskRow(todo) {
  if (state.editingId === todo.id) {
    return make("li", { className: "task", style: "border:0;padding:4px 0" }, editorCard({
      title: todo.title,
      description: todo.description,
      priority: todo.priority,
      submitLabel: "저장",
      onCancel: () => { state.editingId = null; state.focus = `edit-${todo.id}`; render(); },
      onSubmit: async (values) => {
        const ok = await run("수정", () => api(`/todos/${todo.id}`, "PUT", { ...todo, ...values, completed: todo.completed }));
        if (ok) { state.editingId = null; state.focus = `edit-${todo.id}`; await load(); }
        return ok;
      },
    }));
  }

  const check = make("button", { className: "check", type: "button", role: "checkbox" }, icon(ICONS.check, 14));
  check.dataset.priority = String(todo.priority);
  check.dataset.focus = `check-${todo.id}`;
  check.setAttribute("aria-checked", String(todo.completed));
  const prioLabel = todo.priority < 4 ? `우선순위 ${todo.priority} ` : "";
  check.setAttribute("aria-label", `${prioLabel}${todo.title} ${todo.completed ? "완료 취소" : "완료"}`);
  check.onclick = async () => {
    check.disabled = true;
    const ok = await run(todo.completed ? "완료 취소" : "완료 처리",
      () => api(`/todos/${todo.id}`, "PUT", { ...todo, completed: !todo.completed }));
    if (ok) { state.focus = `check-${todo.id}`; await load(); }
    else check.disabled = false;
  };

  const edit = make("button", { className: "icon-btn", type: "button", title: "편집" }, icon(ICONS.edit, 16));
  edit.dataset.focus = `edit-${todo.id}`;
  edit.setAttribute("aria-label", `${todo.title} 편집`);
  edit.onclick = () => { state.editingId = todo.id; state.adding = false; render(); };

  const del = make("button", { className: "icon-btn danger", type: "button", title: "삭제" }, icon(ICONS.trash, 16));
  del.setAttribute("aria-label", `${todo.title} 삭제`);
  del.onclick = () => askDelete(todo, del);

  const prioTag = make("span", { className: "prio-tag" },
    icon(ICONS.flag, 12),
    make("span", { textContent: `우선순위 ${todo.priority}` }),
  );
  prioTag.dataset.priority = String(todo.priority);

  const row = make("li", { className: "task" },
    check,
    make("div", { className: "task-body" },
      make("div", { className: "task-title", textContent: todo.title }),
      todo.description ? make("div", { className: "task-desc", textContent: todo.description }) : null,
      prioTag,
    ),
    make("div", { className: "task-actions" }, edit, del),
  );
  row.dataset.done = String(todo.completed);
  return row;
}

/* ---------- 추가 / 편집 폼 ---------- */
function renderAdder() {
  const box = $("adder");
  if (state.loading || state.failed) {
    box.replaceChildren();
    return;
  }

  if (!state.adding) {
    const trigger = make("button", { className: "add-trigger", type: "button" },
      make("span", { className: "plus" }, icon(ICONS.plus, 14)),
      make("span", { textContent: "할 일 추가" }),
    );
    trigger.dataset.focus = "add";
    trigger.onclick = () => { state.adding = true; state.editingId = null; render(); };
    box.replaceChildren(trigger);
    return;
  }

  box.replaceChildren(editorCard({
    title: "",
    description: "",
    submitLabel: "할 일 추가",
    keepOpen: true,
    onCancel: () => { state.adding = false; state.focus = "add"; render(); },
    onSubmit: async (values) => {
      const ok = await run("추가", () => api("/todos", "POST", values));
      if (ok) await load();
      return ok;
    },
  }));
}

function editorCard({ title, description, priority = 4, submitLabel, keepOpen = false, onSubmit, onCancel }) {
  const titleInput = make("input", { type: "text", value: title, placeholder: "할 일 이름", maxLength: 100 });
  titleInput.setAttribute("aria-label", "할 일 이름");
  const descInput = make("textarea", { value: description || "", placeholder: "설명", rows: 1 });
  descInput.setAttribute("aria-label", "설명");

  let currentPriority = priority;
  const prioButtons = PRIORITIES.map((p) => {
    const name = `우선순위 ${p}${PRIORITY_HINT[p] || ""}`;
    const btn = make("button", { className: "prio-btn", type: "button", title: name },
      icon(ICONS.flag, 14),
      make("span", { textContent: String(p) }),
    );
    btn.setAttribute("aria-label", name);           // 화면 낭독기가 "2" 가 아니라 "우선순위 2" 로 읽는다
    btn.dataset.priority = String(p);
    btn.onclick = (e) => {
      setPriority(p);
      if (e.detail) titleInput.focus();               // 마우스로 골랐으면 제목칸으로 → 바로 Enter 로 제출 (키보드는 detail 0)
    };
    return btn;
  });
  const setPriority = (p) => {
    currentPriority = p;
    prioButtons.forEach((btn) => btn.setAttribute("aria-pressed", String(btn.dataset.priority === String(p))));
  };
  setPriority(priority);
  const prioGroup = make("div", { className: "prio-group", role: "group" },
    make("span", { className: "prio-label", textContent: "우선순위" }),
    ...prioButtons,
  );
  prioGroup.setAttribute("aria-label", "우선순위 (1이 가장 높음)");

  const submit = make("button", { className: "btn btn-primary", type: "submit", textContent: submitLabel, disabled: !title.trim() });
  const cancel = make("button", { className: "btn btn-ghost", type: "button", textContent: "취소" });
  cancel.onclick = onCancel;

  const autoGrow = () => {
    descInput.style.height = "auto";
    descInput.style.height = `${descInput.scrollHeight}px`;
  };
  descInput.oninput = autoGrow;
  titleInput.oninput = () => { submit.disabled = !titleInput.value.trim(); };

  const form = make("form", { className: "card" },
    titleInput,
    descInput,
    make("div", { className: "card-footer" },
      prioGroup,
      make("div", { className: "card-actions" }, cancel, submit),
    ),
  );

  // 한글 조합 중 Enter 는 제출로 처리하지 않는다
  titleInput.onkeydown = (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  };
  form.onkeydown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); onCancel(); }
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const value = titleInput.value.trim();
    if (!value) { titleInput.focus(); return; }

    submit.disabled = true;
    cancel.disabled = true;
    const ok = await onSubmit({ title: value, description: descInput.value.trim(), priority: currentPriority });
    if (!ok) { submit.disabled = false; cancel.disabled = false; return; }
    if (keepOpen) {
      // 연속 등록: 입력만 비우고 폼은 열어 둔다
      titleInput.value = "";
      descInput.value = "";
      setPriority(4);
      autoGrow();
      submit.disabled = true;
      cancel.disabled = false;
      titleInput.focus();
    }
  };

  queueMicrotask(() => { titleInput.focus(); autoGrow(); });
  return form;
}

/* ---------- 삭제 확인 ---------- */
const dialog = $("confirm-dialog");
let deleteTarget = null;
let deleteOpener = null;

function askDelete(todo, opener) {
  deleteTarget = todo;
  deleteOpener = opener;
  $("confirm-target").textContent = `"${todo.title}"`;
  dialog.showModal();
}

$("confirm-cancel").onclick = () => dialog.close();
$("confirm-ok").onclick = async () => {
  const todo = deleteTarget;
  dialog.close();
  if (!todo) return;
  const ok = await run("삭제", () => api(`/todos/${todo.id}`, "DELETE"));
  if (ok) {
    if (state.editingId === todo.id) state.editingId = null;
    state.focus = "add";                              // 누른 삭제 버튼이 사라졌으니 "할 일 추가" 로
    await load();
  }
};
dialog.addEventListener("close", () => {
  if (deleteOpener && deleteOpener.isConnected) deleteOpener.focus();
  deleteTarget = null;
  deleteOpener = null;
});

render();
load();
</script>
