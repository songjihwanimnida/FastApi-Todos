# Grafana 가 시작할 때 읽는 데이터 소스 설정 (UI 에서 만든 Prometheus 데이터 소스는 grafana-data 볼륨에 따로 있음)
apiVersion: 1

datasources:
  - name: InfluxDB-JMeter
    type: influxdb
    uid: influxdb-jmeter                        # 대시보드가 이 uid 로 참조하므로 고정
    access: proxy                               # 브라우저가 아니라 Grafana 서버가 influxdb:8086 에 접속 (내부 네트워크 전용)
    url: http://influxdb:8086
    jsonData:
      dbName: jmeter                            # docker-compose 의 INFLUXDB_DB 와 같아야 함
      httpMode: GET
    editable: false                             # 설정은 이 파일로만 바꿈
